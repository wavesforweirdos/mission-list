name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Lint PHP files
        run: find app lib web config \( -name '*.php' -o -name '*.phtml' \) -print0 | xargs -0 -n1 php -l

      - name: Smoke test
        run: tests/smoke.sh
